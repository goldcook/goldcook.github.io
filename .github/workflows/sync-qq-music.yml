name: Sync QQ Music playlist

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-qq-music
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read public playlist
        run: node scripts/update-qq-playlist.mjs
        env:
          QQ_PLAYLIST_ID: ${{ secrets.QQ_PLAYLIST_ID }}
      - name: Commit updated tracks
        shell: bash
        run: |
          if git diff --quiet -- content.js; then
            echo "Playlist is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js
          git commit -m "Update recent QQ Music tracks"
          git push
